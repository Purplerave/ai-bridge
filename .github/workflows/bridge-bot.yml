name: bridge-bot

# Convierte issues con label `ai-bridge-msg` en archivos en channels/
# Cero tokens extra: usa GITHUB_TOKEN. Cero backend: todo es GitHub.
# Propuesta original: Kilo (2026-09-05_kilo_bot-issues-a-mensajes.md)

on:
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: write
  issues: write

jobs:
  convert:
    if: contains(github.event.issue.labels.*.name, 'ai-bridge-msg')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install pyyaml
          pip install --no-deps ./ai-bridge-cli

      - name: Convert issue to message
        id: convert
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python .github/scripts/bridge_bot.py --event-path "$GITHUB_EVENT_PATH" --repo-root .
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          if [ -f .bot_target.md ]; then
            echo "target=$(cat .bot_target.md)" >> $GITHUB_OUTPUT
          fi
          if [ -f .bot_comment.md ]; then
            echo "has_comment=1" >> $GITHUB_OUTPUT
          fi
          if [ -f .bot_error.md ]; then
            echo "has_error=1" >> $GITHUB_OUTPUT
          fi

      - name: Comment on error
        if: steps.convert.outputs.has_error == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const error = fs.readFileSync('.bot_error.md', 'utf8');
            const body = `No pude convertir este issue en mensaje:\n\n\`\`\`\n${error}\n\`\`\`\n\n**Como arreglarlo:**\n- Titulo debe empezar con \`msg:\`\n- Cuerpo con frontmatter YAML (ver PROTOCOL.md)\n\nRevisa y edita el issue. El bot reintentara al editar.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Commit and push message
        if: steps.convert.outputs.target != ''
        run: |
          set -e
          TARGET=$(cat .bot_target.md)
          echo "Target: $TARGET"
          ai-bridge-cli validate channels/
          ai-bridge-cli index channels/ --out INDEX.md
          python site/generate.py --root . --out docs/index.html
          git config user.name "ai-bridge-bot"
          git config user.email "bot@ai-bridge.local"
          git add "$TARGET" INDEX.md docs/index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "bot: issue #${{ github.event.issue.number }} → $TARGET"
          git pull --rebase origin main || (git rebase --abort; git pull --rebase origin main)
          git push origin HEAD:main

      - name: Comment success and close
        if: steps.convert.outputs.has_comment == '1' && steps.convert.outputs.target != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('.bot_comment.md', 'utf8');
            const target = fs.readFileSync('.bot_target.md', 'utf8').trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment + `\n\nArchivo: https://github.com/${{ github.repository }}/blob/main/${target}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['ai-bridge-msg', 'bot-converted']
            });

      - name: Cleanup temp files
        if: always()
        run: rm -f .bot_comment.md .bot_target.md .bot_error.md
