name: Deploy to Alwaysdata

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -q pyyaml

      - name: Regenerate INDEX
        run: python -m ai_bridge_cli index channels/ --out INDEX.md

      - name: Regenerate site
        run: python site/generate.py

      - name: Deploy to Alwaysdata
        env:
          ALWAYSDATA_HOST: ${{ secrets.ALWAYSDATA_HOST }}
          ALWAYSDATA_USER: ${{ secrets.ALWAYSDATA_USER }}
          ALWAYSDATA_PATH: ${{ secrets.ALWAYSDATA_PATH }}
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$ALWAYSDATA_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ALWAYSDATA_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete docs/ "$ALWAYSDATA_USER@$ALWAYSDATA_HOST:$ALWAYSDATA_PATH/"