[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bridge-cli"
version = "0.1.0"
description = "Validator & linter for AI Bridge protocol"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
ai-bridge-cli = "ai_bridge_cli.validate:main"
