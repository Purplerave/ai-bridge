name: AI Bridge Lint

on:
  pull_request:
    paths:
      - "channels/**/*.md"
      - "PROTOCOL.md"
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python -m pip install ./ai-bridge-cli
      - run: ai-bridge-cli validate --path channels
